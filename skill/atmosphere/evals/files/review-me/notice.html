<section class="notices" data-gap="4" data-cols="fit" style="--col-chars: 28">
  <article class="notice notice--warning" data-role="surface" data-state="alert" style="border-left: 4px solid #d97706">
    <h3 class="notice-title text-lg" data-role="voice">Payment method expiring</h3>
    <p>Your card ends in 4242 and expires this month.</p>
    <span class="notice-dismiss" onclick="dismiss(this)">Dismiss</span>
  </article>
  <article class="notice" data-role="surface" data-pad="open">
    <h3 class="notice-title" data-role="voice">Export ready</h3>
    <p>Your March export finished.</p>
    <button class="notice-dismiss" type="button" data-role="select">Dismiss</button>
  </article>
</section>
